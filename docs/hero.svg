<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">RenderVet catches silent failures in a twelve-shot media batch</title>
  <desc id="desc">A dark dashboard shows one missing sequence item, one corrupt file, one wrong-size image, one stale file, one bad extension, and an exact duplicate group.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="0.58" stop-color="#121b31"/>
      <stop offset="1" stop-color="#091321"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#78a4ff"/><stop offset="1" stop-color="#8b7cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#02050c" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1280" height="720" rx="30" fill="url(#bg)"/>
  <circle cx="1125" cy="-10" r="280" fill="#496bff" opacity=".10"/>
  <circle cx="60" cy="690" r="220" fill="#35d07f" opacity=".07"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="58" y="68" fill="#7aa2ff" font-size="15" font-weight="700" letter-spacing="3">BATCH PREFLIGHT</text>
    <text x="58" y="119" fill="#f1f5ff" font-size="46" font-weight="800">RenderVet</text>
    <text x="294" y="117" fill="#91a0ba" font-size="19">one command before delivery</text>
    <g transform="translate(993 58)">
      <rect width="224" height="46" rx="23" fill="#17243b" stroke="#2a3c5d"/>
      <circle cx="25" cy="23" r="5" fill="#35d07f"/>
      <text x="42" y="29" fill="#b9c7dc" font-size="14">local-only · read-only</text>
    </g>

    <g transform="translate(58 154)" filter="url(#shadow)">
      <rect width="520" height="500" rx="18" fill="#0c1424" stroke="#283650"/>
      <circle cx="24" cy="24" r="5" fill="#ff6b6b"/><circle cx="42" cy="24" r="5" fill="#f6c453"/><circle cx="60" cy="24" r="5" fill="#35d07f"/>
      <text x="25" y="82" fill="#9eb3d5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">$ rendervet demo --force</text>
      <text x="25" y="126" fill="#ffffff" font-size="25" font-weight="750">FAIL</text>
      <text x="92" y="126" fill="#94a3b8" font-size="17">11 files · 10 errors · 0 warnings</text>
      <line x1="25" y1="151" x2="495" y2="151" stroke="#283650"/>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
        <text x="25" y="190" fill="#ff8585">ERROR</text><text x="91" y="190" fill="#d8e4fa">missing sequence</text><text x="450" y="190" fill="#ff8585">#004</text>
        <text x="25" y="228" fill="#ff8585">ERROR</text><text x="91" y="228" fill="#d8e4fa">corrupt PNG signature</text><text x="398" y="228" fill="#ff8585">#006</text>
        <text x="25" y="266" fill="#ff8585">ERROR</text><text x="91" y="266" fill="#d8e4fa">expected 64×64, got 96×64</text><text x="450" y="266" fill="#ff8585">#008</text>
        <text x="25" y="304" fill="#ff8585">ERROR</text><text x="91" y="304" fill="#d8e4fa">exact duplicate SHA-256</text><text x="363" y="304" fill="#ff8585">#003 #009</text>
        <text x="25" y="342" fill="#ff8585">ERROR</text><text x="91" y="342" fill="#d8e4fa">stale output from older run</text><text x="450" y="342" fill="#ff8585">#011</text>
        <text x="25" y="380" fill="#ff8585">ERROR</text><text x="91" y="380" fill="#d8e4fa">extension .jpg not allowed</text><text x="450" y="380" fill="#ff8585">#012</text>
      </g>
      <rect x="25" y="424" width="470" height="52" rx="10" fill="#15233b" stroke="#2f4264"/>
      <text x="43" y="456" fill="#a9bde0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">HTML  .rendervet/report.html</text>
    </g>

    <g transform="translate(610 154)" filter="url(#shadow)">
      <rect width="607" height="500" rx="18" fill="#111b2e" stroke="#283650"/>
      <text x="25" y="43" fill="#f1f5ff" font-size="19" font-weight="700">12 expected shots</text>
      <text x="25" y="69" fill="#91a0ba" font-size="14">mechanical proof, not aesthetic scoring</text>
      <g transform="translate(25 96)">
        <g fill="#17392a" stroke="#286244"><rect x="0" y="0" width="126" height="82" rx="12"/><rect x="142" y="0" width="126" height="82" rx="12"/><rect x="0" y="98" width="126" height="82" rx="12"/><rect x="284" y="98" width="126" height="82" rx="12"/><rect x="142" y="196" width="126" height="82" rx="12"/></g>
        <g fill="#48212a" stroke="#8a3541"><rect x="284" y="0" width="126" height="82" rx="12"/><rect x="426" y="0" width="126" height="82" rx="12"/><rect x="142" y="98" width="126" height="82" rx="12"/><rect x="426" y="98" width="126" height="82" rx="12"/><rect x="0" y="196" width="126" height="82" rx="12"/><rect x="284" y="196" width="126" height="82" rx="12"/><rect x="426" y="196" width="126" height="82" rx="12"/></g>
        <g fill="#9cf1bd" font-size="15" font-weight="700"><text x="16" y="31">#001 PASS</text><text x="158" y="31">#002 PASS</text><text x="16" y="129">#005 PASS</text><text x="300" y="129">#007 PASS</text><text x="158" y="227">#010 PASS</text></g>
        <g fill="#ff9b9b" font-size="15" font-weight="700"><text x="300" y="31">#003</text><text x="442" y="31">#004</text><text x="158" y="129">#006</text><text x="442" y="129">#008</text><text x="16" y="227">#009</text><text x="300" y="227">#011</text><text x="442" y="227">#012</text></g>
        <g fill="#cbd6ea" font-size="12"><text x="300" y="57">duplicate</text><text x="442" y="57">missing</text><text x="158" y="155">corrupt</text><text x="442" y="155">wrong size</text><text x="16" y="253">duplicate</text><text x="300" y="253">stale</text><text x="442" y="253">bad type</text></g>
      </g>
      <rect x="25" y="405" width="557" height="66" rx="12" fill="url(#accent)" opacity=".17" stroke="#758cff"/>
      <text x="48" y="434" fill="#dbe6ff" font-size="13" font-weight="700">retry-manifest.json</text>
      <text x="48" y="456" fill="#aebfe2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">missing #004 · retry #003 #006 #008 #009 #011 #012</text>
    </g>
  </g>
</svg>
